spring.application.name=TaskHive
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskhive}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:taskhive}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:taskhive}

logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/db.changelog-master.yaml
server.servlet.context-path=/api

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
jwt.expiration =${JWT_EXPIRATION:3600000}

jwt.secret = ${JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

