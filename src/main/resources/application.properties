spring.application.name=TaskHive

server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/TaskHive}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:Admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/db.changelog-master.yaml
server.servlet.context-path=/api

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
jwt.expiration =${JWT_EXPIRATION:3600000}

jwt.secret = ${JWT_SECRET:h3ell3o3mat3e2ou3riu3b2vjneifvbernvejbtiervebfrrrfbrbyrjuk}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
